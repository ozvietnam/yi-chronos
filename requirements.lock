# requirements.lock — PIN CHÍNH XÁC toàn bộ cây phụ thuộc (review 2026-06-21, P2).
#
# Vì sao: requirements.txt dùng `>=` (intent) → mỗi lần build image resolve lại phiên
# bản mới nhất → build KHÔNG tái lập + minor release có thể vỡ runtime ngầm + rủi ro
# supply-chain (pull bản compromise). Lock này chốt ĐÚNG cây đang chạy production (chụp
# từ `docker exec yi-chronos pip freeze` ngày 2026-06-21) → Dockerfile cài từ đây.
#
# CẬP NHẬT lock (khi nâng deps có chủ đích): sửa requirements.txt → build/cài trên Linux
# → `pip freeze > requirements.lock` → kiểm chạy → commit cả hai. KHÔNG sửa tay từng dòng.
