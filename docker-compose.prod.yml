services:
  yi-chronos:
    image: ghcr.io/ozvietnam/yi-chronos:latest
    container_name: yi-chronos
    restart: unless-stopped
    env_file:
      # Loads YI_CHRONOS_FOUNDER_EMAIL, YI_CHRONOS_FOUNDER_PASSWORD, etc.
      # File lives on VPS at /opt/yi-chronos/.env (chmod 600, not in repo).
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - YI_CHRONOS_DATABASE_URL=sqlite:///Users/ozvietnamdesktop/Desktop/yi/data/yi_chronos.sqlite3
      - YI_CHRONOS_CORS_ORIGINS=${YI_CHRONOS_CORS_ORIGINS:-https://kinhdich.online,https://www.kinhdich.online}
    volumes:
      # Host /opt/yi-chronos/data → container path matching Mac (WORKDIR-relative)
      - /opt/yi-chronos/data:/Users/ozvietnamdesktop/Desktop/yi/data
    # Traefik runs in host network on this VPS — it can reach bridge container IPs.
    # No need to share an external network; just expose internal port via labels.
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"

      # Main HTTPS router (public — Mai Hoa cast, browse Vue app, etc.)
      - "traefik.http.routers.yi-chronos.rule=Host(`kinhdich.online`) || Host(`www.kinhdich.online`)"
      - "traefik.http.routers.yi-chronos.entrypoints=websecure"
      - "traefik.http.routers.yi-chronos.tls=true"
      - "traefik.http.routers.yi-chronos.tls.certresolver=letsencrypt"
      - "traefik.http.services.yi-chronos.loadbalancer.server.port=8000"

      # Settings router (gated — /api/ai/* manages provider keys + prompts).
      # Higher priority so it matches before the catch-all main router.
      - "traefik.http.middlewares.yi-settings-auth.basicauth.users=${YI_SETTINGS_HTPASSWD}"
      - "traefik.http.middlewares.yi-settings-auth.basicauth.realm=YI-Chronos Settings"
      - "traefik.http.routers.yi-chronos-settings.rule=(Host(`kinhdich.online`) || Host(`www.kinhdich.online`)) && PathPrefix(`/api/ai/`)"
      - "traefik.http.routers.yi-chronos-settings.entrypoints=websecure"
      - "traefik.http.routers.yi-chronos-settings.tls=true"
      - "traefik.http.routers.yi-chronos-settings.tls.certresolver=letsencrypt"
      - "traefik.http.routers.yi-chronos-settings.middlewares=yi-settings-auth"
      - "traefik.http.routers.yi-chronos-settings.priority=100"

      # NOTE: HTTP→HTTPS redirect is global on this Traefik
      # (--entrypoints.web.http.redirections.entrypoint.to=websecure)
      # so we don't need an explicit insecure router.
