name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is handled by deploy.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # 3.14 not yet in ubuntu-latest; 3.12 compat
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Smoke + core tests (BẮT BUỘC pass — không còn '|| true')
        env:
          YI_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          python -c "from api.main import app; print('boot OK, routes =', len(app.routes))"
          python -m pytest tests/test_luu_nguyet.py tests/test_douyin_research_text.py tests/test_ha_lac.py tests/test_tu_vi_paradigm_engine.py tests/test_yolo_e2e.py -q --tb=short
      - name: Run pytest (toàn bộ — chỉ thông tin, chưa chặn vì ~35 test cần môi trường/dữ liệu riêng)
        env:
          YI_PROJECT_ROOT: ${{ github.workspace }}
        run: python -m pytest tests/ -q --tb=short 2>&1 || true
        # '|| true' until Issue #4 path cleanup fully propagates to engine/core

  webapp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build webapp
        run: cd client/webapp && npm ci && npm run build
