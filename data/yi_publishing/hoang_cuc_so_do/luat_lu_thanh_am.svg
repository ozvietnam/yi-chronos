<svg viewBox="0 0 1180 880" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, STKaiti, Songti SC, serif">
<rect width="1180" height="880" fill="#fbf7ef"/>
<text x="590.0" y="40" text-anchor="middle" font-size="27" fill="#2a2018" font-weight="bold">LUẬT-LỮ THANH ÂM — nửa "TIẾNG" của vũ trụ</text>
<text x="590.0" y="68" text-anchor="middle" font-size="14" fill="#7a5a2a">律吕声音 · "Lịch ghi trời-đất, Luật ghi vạn vật; vật có sắc-thanh-khí-vị, mà THANH thịnh nhất" (Nội Thiên 11)</text>
<text x="590.0" y="110" text-anchor="middle" font-size="15" fill="#2f5d8a" font-weight="bold">① MỘT vũ trụ, HAI cách đọc — "đồng dạng"</text>
<rect x="100" y="122" width="460" height="58" rx="8" fill="#2f5d8a" fill-opacity="0.08" stroke="#2f5d8a" stroke-opacity="0.45"/>
<text x="135" y="160" font-size="30" fill="#2f5d8a" font-weight="bold">历</text>
<text x="180" y="149" font-size="16" fill="#2f5d8a" font-weight="bold">LỊCH (thời)</text>
<text x="180" y="169" font-size="11.5" fill="#777">元会运世 · Nguyên-Hội-Vận-Thế · Chương 1-5</text>
<rect x="620" y="122" width="460" height="58" rx="8" fill="#a8621c" fill-opacity="0.08" stroke="#a8621c" stroke-opacity="0.45"/>
<text x="655" y="160" font-size="30" fill="#a8621c" font-weight="bold">律</text>
<text x="700" y="149" font-size="16" fill="#a8621c" font-weight="bold">LUẬT (tiếng)</text>
<text x="700" y="169" font-size="11.5" fill="#777">声音唱和 · thanh âm · chương này</text>
<text x="590.0" y="154" text-anchor="middle" font-size="20" fill="#999">↔</text>
<text x="590.0" y="210" text-anchor="middle" font-size="15" fill="#3f7d54" font-weight="bold">② TÁM ÂM = Trời 4 + Đất 4 (chính là 8 đẳng Chương 1) — mỗi âm mang số 10 (dương/cương) hoặc 12 (âm/nhu)</text>
<text x="70" y="248" font-size="13" fill="#555" font-weight="bold">TRỜI</text>
<rect x="190" y="222" width="200" height="46" rx="6" fill="#c98a2e" fill-opacity="0.10" stroke="#c98a2e" stroke-opacity="0.5"/>
<text x="206" y="254" font-size="24" fill="#c98a2e" font-weight="bold">日</text>
<text x="242" y="242" font-size="13" fill="#3a2e20" font-weight="bold">Nhật · 太阳</text>
<text x="242" y="260" font-size="12" fill="#777">số 10</text>
<rect x="420" y="222" width="200" height="46" rx="6" fill="#3f5d8a" fill-opacity="0.10" stroke="#3f5d8a" stroke-opacity="0.5"/>
<text x="436" y="254" font-size="24" fill="#3f5d8a" font-weight="bold">月</text>
<text x="472" y="242" font-size="13" fill="#3a2e20" font-weight="bold">Nguyệt · 太阴</text>
<text x="472" y="260" font-size="12" fill="#777">số 12</text>
<rect x="650" y="222" width="200" height="46" rx="6" fill="#c98a2e" fill-opacity="0.10" stroke="#c98a2e" stroke-opacity="0.5"/>
<text x="666" y="254" font-size="24" fill="#c98a2e" font-weight="bold">星</text>
<text x="702" y="242" font-size="13" fill="#3a2e20" font-weight="bold">Tinh · 少阳</text>
<text x="702" y="260" font-size="12" fill="#777">số 10</text>
<rect x="880" y="222" width="200" height="46" rx="6" fill="#3f5d8a" fill-opacity="0.10" stroke="#3f5d8a" stroke-opacity="0.5"/>
<text x="896" y="254" font-size="24" fill="#3f5d8a" font-weight="bold">辰</text>
<text x="932" y="242" font-size="13" fill="#3a2e20" font-weight="bold">Thần · 少阴</text>
<text x="932" y="260" font-size="12" fill="#777">số 12</text>
<text x="70" y="304" font-size="13" fill="#555" font-weight="bold">ĐẤT</text>
<rect x="190" y="278" width="200" height="46" rx="6" fill="#a85a3a" fill-opacity="0.10" stroke="#a85a3a" stroke-opacity="0.5"/>
<text x="206" y="310" font-size="24" fill="#a85a3a" font-weight="bold">火</text>
<text x="242" y="298" font-size="13" fill="#3a2e20" font-weight="bold">Hỏa · 太刚</text>
<text x="242" y="316" font-size="12" fill="#777">số 10</text>
<rect x="420" y="278" width="200" height="46" rx="6" fill="#2f7d8a" fill-opacity="0.10" stroke="#2f7d8a" stroke-opacity="0.5"/>
<text x="436" y="310" font-size="24" fill="#2f7d8a" font-weight="bold">水</text>
<text x="472" y="298" font-size="13" fill="#3a2e20" font-weight="bold">Thủy · 太柔</text>
<text x="472" y="316" font-size="12" fill="#777">số 12</text>
<rect x="650" y="278" width="200" height="46" rx="6" fill="#a85a3a" fill-opacity="0.10" stroke="#a85a3a" stroke-opacity="0.5"/>
<text x="666" y="310" font-size="24" fill="#a85a3a" font-weight="bold">石</text>
<text x="702" y="298" font-size="13" fill="#3a2e20" font-weight="bold">Thạch · 少刚</text>
<text x="702" y="316" font-size="12" fill="#777">số 10</text>
<rect x="880" y="278" width="200" height="46" rx="6" fill="#5a7d4a" fill-opacity="0.10" stroke="#5a7d4a" stroke-opacity="0.5"/>
