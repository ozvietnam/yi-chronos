<text x="932" y="316" font-size="12" fill="#777">số 12</text>
<text x="590.0" y="350" text-anchor="middle" font-size="11" fill="#999">Quẻ ↔ hành đổi theo ngữ cảnh (变象) — sách dặn "đừng kẹt vào tên": cấu trúc 8 là thật, nhãn thì linh hoạt</text>
<text x="590.0" y="410" text-anchor="middle" font-size="15" fill="#8a4a14" font-weight="bold">③ THỂ SỐ → DỤNG SỐ (tiến 4 thoái 1: lấy 4 lần, trừ đi "thể" của bên kia)</text>
<text x="90" y="462" font-size="13.5" fill="#a8621c" font-weight="bold">DƯƠNG / CƯƠNG</text>
<text x="90" y="480" font-size="10.5" fill="#888">日星 · 火石 (4 cái ×10)</text>
<rect x="330" y="442" width="150" height="40" rx="6" fill="#eee" stroke="#ccc"/>
<text x="405" y="460" text-anchor="middle" font-size="12" fill="#666">thể số</text>
<text x="405" y="476" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4×40 = 160</text>
<text x="500" y="468" text-anchor="middle" font-size="13" fill="#a85a3a">− 48 (thể âm nhu) →</text>
<rect x="650" y="442" width="120" height="40" rx="6" fill="#a8621c" fill-opacity="0.14" stroke="#a8621c"/>
<text x="710" y="460" text-anchor="middle" font-size="12" fill="#a8621c">dụng số</text>
<text x="710" y="476" text-anchor="middle" font-size="17" fill="#a8621c" font-weight="bold">112</text>
<text x="90" y="530" font-size="13.5" fill="#2f5d8a" font-weight="bold">ÂM / NHU</text>
<text x="90" y="548" font-size="10.5" fill="#888">月辰 · 水土 (4 cái ×12)</text>
<rect x="330" y="510" width="150" height="40" rx="6" fill="#eee" stroke="#ccc"/>
<text x="405" y="528" text-anchor="middle" font-size="12" fill="#666">thể số</text>
<text x="405" y="544" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4×48 = 192</text>
<text x="500" y="536" text-anchor="middle" font-size="13" fill="#a85a3a">− 40 (thể dương cương) →</text>
<rect x="650" y="510" width="120" height="40" rx="6" fill="#2f5d8a" fill-opacity="0.14" stroke="#2f5d8a"/>
<text x="710" y="528" text-anchor="middle" font-size="12" fill="#2f5d8a">dụng số</text>
<text x="710" y="544" text-anchor="middle" font-size="17" fill="#2f5d8a" font-weight="bold">152</text>
<text x="590.0" y="600" text-anchor="middle" font-size="15" fill="#7a3410" font-weight="bold">④ XƯỚNG-HỌA (nhân chéo) → SỐ VẠN VẬT</text>
<rect x="380" y="622" width="100" height="44" rx="6" fill="#a8621c" fill-opacity="0.14" stroke="#a8621c"/>
<text x="430" y="650" text-anchor="middle" font-size="20" fill="#a8621c" font-weight="bold">112</text>
<text x="510" y="650" text-anchor="middle" font-size="20" fill="#666">×</text>
<rect x="540" y="622" width="100" height="44" rx="6" fill="#2f5d8a" fill-opacity="0.14" stroke="#2f5d8a"/>
<text x="590" y="650" text-anchor="middle" font-size="20" fill="#2f5d8a" font-weight="bold">152</text>
<text x="690" y="650" text-anchor="middle" font-size="20" fill="#666">=</text>
<rect x="720" y="622" width="150" height="44" rx="6" fill="#3f7d54" fill-opacity="0.16" stroke="#3f7d54"/>
<text x="795" y="650" text-anchor="middle" font-size="20" fill="#2f6d44" font-weight="bold">17.024</text>
<text x="940" y="644" font-size="12" fill="#777">động số = thực số</text>
<text x="940" y="660" font-size="11" fill="#999">(日月星辰 biến · 水火土石 hóa)</text>
<line x1="590.0" y1="670" x2="590.0" y2="692" stroke="#bbb"/>
<rect x="320" y="694" width="540" height="58" rx="9" fill="#7a3410" fill-opacity="0.07" stroke="#7a3410" stroke-opacity="0.4"/>
<text x="590.0" y="718" text-anchor="middle" font-size="15" fill="#7a3410">17.024 × 17.024 =</text>
<text x="590.0" y="744" text-anchor="middle" font-size="24" fill="#7a3410" font-weight="bold">289.816.576</text>
<text x="590.0" y="772" text-anchor="middle" font-size="13" fill="#8a4a14" font-weight="bold">ĐỘNG-THỰC THÔNG SỐ — con số "vạn vật" của Thiệu Ung</text>
<text x="590.0" y="864" text-anchor="middle" font-size="11" fill="#999">Nguồn: Quan Vật Nội Thiên 11, tr.229-234 (Thiệu Bá Ôn · Hoàng thị · Vương thị · Chúc thị) · Bảng 声音唱和图 chi tiết (chữ nào ứng đâu) = bước sau</text>
</svg>