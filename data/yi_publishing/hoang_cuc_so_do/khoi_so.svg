<text x="590.0" y="40" text-anchor="middle" font-size="26" fill="#2a2018" font-weight="bold">CƠ MẬT 起数 — quẻ-năm KHÔNG bí truyền, là THÁC BIẾN HÀO 4 TẦNG</text>
<text x="590.0" y="67" text-anchor="middle" font-size="13.5" fill="#7a5a2a">Nguyên lý 一贞八悔 · mỗi tầng = đổi lần lượt 6 hào (一卦六变) · bản 今说 giải rõ, không giấu</text>
<text x="60" y="92" font-size="15" fill="#7a3410" font-weight="bold">① THÁC 4 TẦNG (会 → 运 → 世 → 年)</text>
