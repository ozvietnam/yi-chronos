<text x="940" y="422" text-anchor="middle" font-size="11" fill="#3f7d54">✓ khớp chính văn dòng 1705 (engine test xanh)</text>
<rect x="60" y="470" width="1060" height="150" rx="10" fill="#c9a13b" fill-opacity="0.06" stroke="#c9a13b" stroke-opacity="0.4"/>
<text x="590.0" y="498" text-anchor="middle" font-size="15" fill="#8a4a14" font-weight="bold">③ NGUYÊN LÝ 一贞八悔 (một trinh, tám hối)</text>
<text x="590.0" y="522" text-anchor="middle" font-size="12" fill="#555">MỘT quái DƯỚI (贞 / bản quái) ghép CẢ TÁM quái TRÊN (悔 / biến quái) → 8 quẻ. 8 贞 × 8 悔 = 64 quẻ.</text>
<text x="590.0" y="548" text-anchor="middle" font-size="12" fill="#555">Tả Truyện đã dùng: 蛊 = 贞 巽(phong) · 悔 艮(sơn); 随 = 贞 雷(chấn) · 悔 đoài. — quẻ = (dưới, trên).</text>
<text x="590.0" y="574" text-anchor="middle" font-size="12" fill="#555">Vì biến hào LỒNG nhiều tầng nên cùng Giáp Tý mà 304 = 革 còn 2044 = 大過 — KHÔNG phải vòng 60 cố định.</text>
<text x="590.0" y="648" text-anchor="middle" font-size="14" fill="#2f5d8a" font-weight="bold">Vậy "cơ mật" là gì?</text>
<text x="590.0" y="672" text-anchor="middle" font-size="12" fill="#444">Không phải một con số thần bí — mà là một CƠ CHẾ SINH: từ 1 quẻ gốc, đổi hào lồng 4 tầng, sinh ra</text>
<text x="590.0" y="695" text-anchor="middle" font-size="12" fill="#444">quẻ của từng hội/vận/thế/năm. Nắm cơ chế = suy được BẤT KỲ năm nào, không cần thuộc bảng.</text>
<text x="590.0" y="718" text-anchor="middle" font-size="12" fill="#444">Tổ sư giấu cái KHÓA (phép biến), không giấu từng con số. 今说 mở khóa ấy ra — và nó VẬN HÀNH ĐƯỢC.</text>
<text x="590.0" y="884" text-anchor="middle" font-size="11" fill="#999">engine.hoang_cuc.khoi_so — bits_of/bien_hao/sau_bien/chuoi_60_van · 17/17 test · nguồn Ngoại Thiên dòng 1703-1707, 8935</text>
</svg>