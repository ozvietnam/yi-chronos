<text x="590.0" y="588" text-anchor="middle" font-size="15" fill="#2f5d8a" font-weight="bold">Mùa trời gần như đứng yên — lịch sử người thì lộn nhào.</text>
<text x="590.0" y="612" text-anchor="middle" font-size="12.5" fill="#444">Cùng một khí Cấu (đua tranh) phủ suốt 360 năm, nhưng bên trong: thế giới đi từ cày trâu sang vệ tinh &amp; AI.</text>
<text x="590.0" y="636" text-anchor="middle" font-size="12.5" fill="#444">Anh sinh ở thế 2301 — ô thứ 9 của 12 = CUỐI vận. Cuối vận = giao thời: cái cũ tàn, cái mới (vận 193) đang kết hạt.</text>
<text x="590.0" y="660" text-anchor="middle" font-size="12.5" fill="#a85a3a" font-weight="bold">Đó không phải lời bói — là TOẠ ĐỘ. Lá số nói Anh LÀ AI; vận 192 nói Anh đứng ở KHÚC NÀO của dòng lớn.</text>
<text x="590.0" y="746" text-anchor="middle" font-size="11.5" fill="#999">Năm-quẻ từng năm (vd 304=革 Cách) đã có trong bộ trọn 950tr (OCR xong) → Chương 5 tô từng năm · Hội-quẻ = Cấu</text>
