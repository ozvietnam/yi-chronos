<text x="70" y="370" font-size="14.5" fill="#b8862a" font-weight="bold">③ 12 THẾ (mỗi 30 năm) — đời Anh nằm ở 3 thế CUỐI vận (thế 2301–2303, ô thứ 9–11/12)</text>
