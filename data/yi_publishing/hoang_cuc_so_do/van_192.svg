<text x="590.0" y="40" text-anchor="middle" font-size="27" fill="#2a2018" font-weight="bold">VẬN 192 — 360 năm chứa trọn đời Anh</text>
<text x="590.0" y="68" text-anchor="middle" font-size="14.5" fill="#7a5a2a">Hội Ngọ · quẻ Cấu (姤) · vận thứ 12/30 của hội · 12 thế · năm 1744–2103 CN — engine neo 304CN=thế2245</text>
<text x="70" y="100" font-size="14.5" fill="#3f7d54" font-weight="bold">① KHÍ HỘI NGỌ (Cấu — "mùa đua tranh") · gần như PHẲNG suốt vận: cùng một mùa trời</text>
<rect x="70" y="110" width="1040" height="30" fill="#3f7d54" fill-opacity="0.14" stroke="#3f7d54" stroke-opacity="0.4"/>
<line x1="70" y1="125" x2="1110" y2="125" stroke="#3f7d54" stroke-width="1.5" stroke-opacity="0.5"/>
<text x="590.0" y="155" text-anchor="middle" font-size="11" fill="#888">Trong 1 vận, "mùa" của hội đổi không đáng kể (chỉ ~37%→40% chặng hội Ngọ 10.800 năm)</text>
<text x="70" y="200" font-size="14.5" fill="#a85a3a" font-weight="bold">② LỊCH SỬ NGƯỜI · BIẾN ĐỘNG dữ dội: nông nghiệp → công nghiệp → số/AI</text>
