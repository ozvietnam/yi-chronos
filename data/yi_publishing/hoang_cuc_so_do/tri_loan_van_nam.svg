<text x="550.0" y="686" text-anchor="middle" font-size="13.5" fill="#2f5d8a">"Thiên địa đại vận, Bĩ dịch nhi Thái" (tr.185) — suy tới cực thì có cơ xoay lại. Đây là ARC ĐỊNH TÍNH; bảng năm chính xác ở tập Trung/Hạ.</text>
