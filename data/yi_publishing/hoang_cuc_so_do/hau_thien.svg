<text x="912" y="660" font-size="10" fill="#777">cuối đông — thành, dừng</text>
<text x="590.0" y="844" text-anchor="middle" font-size="11" fill="#999">Văn Vương đổi vị Phục Hy "để ứng thiên thời, ứng địa phương" — biến THỂ của Dịch thành DỤNG (tr.461) · "vương giả chi pháp"</text>
