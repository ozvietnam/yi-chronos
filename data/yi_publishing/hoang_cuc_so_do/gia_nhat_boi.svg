<rect x="898" y="197" width="19" height="7" fill="#7a3410"/><rect x="923" y="197" width="19" height="7" fill="#7a3410"/>
<text x="1110" y="209" text-anchor="end" font-size="11" fill="#888">4 — Tứ Tượng</text>
<rect x="122" y="263" width="44" height="7" fill="#7a3410"/><rect x="122" y="252" width="44" height="7" fill="#7a3410"/><rect x="122" y="241" width="44" height="7" fill="#7a3410"/>
<text x="144" y="299" text-anchor="middle" font-size="14" fill="#7a3410" font-weight="bold">乾</text>
<text x="144" y="315" text-anchor="middle" font-size="10.5" fill="#777">Càn</text>
<rect x="249" y="263" width="44" height="7" fill="#7a3410"/><rect x="249" y="252" width="44" height="7" fill="#7a3410"/><rect x="249" y="241" width="19" height="7" fill="#7a3410"/><rect x="274" y="241" width="19" height="7" fill="#7a3410"/>
<text x="271" y="299" text-anchor="middle" font-size="14" fill="#7a3410" font-weight="bold">兑</text>
<text x="271" y="315" text-anchor="middle" font-size="10.5" fill="#777">Đoài</text>
<rect x="377" y="263" width="44" height="7" fill="#7a3410"/><rect x="377" y="252" width="19" height="7" fill="#7a3410"/><rect x="402" y="252" width="19" height="7" fill="#7a3410"/><rect x="377" y="241" width="44" height="7" fill="#7a3410"/>
<text x="399" y="299" text-anchor="middle" font-size="14" fill="#7a3410" font-weight="bold">离</text>
<text x="399" y="315" text-anchor="middle" font-size="10.5" fill="#777">Ly</text>
<rect x="504" y="263" width="44" height="7" fill="#7a3410"/><rect x="504" y="252" width="19" height="7" fill="#7a3410"/><rect x="529" y="252" width="19" height="7" fill="#7a3410"/><rect x="504" y="241" width="19" height="7" fill="#7a3410"/><rect x="529" y="241" width="19" height="7" fill="#7a3410"/>
<text x="526" y="299" text-anchor="middle" font-size="14" fill="#7a3410" font-weight="bold">震</text>
<text x="526" y="315" text-anchor="middle" font-size="10.5" fill="#777">Chấn</text>
<rect x="632" y="263" width="19" height="7" fill="#7a3410"/><rect x="657" y="263" width="19" height="7" fill="#7a3410"/><rect x="632" y="252" width="44" height="7" fill="#7a3410"/><rect x="632" y="241" width="44" height="7" fill="#7a3410"/>
