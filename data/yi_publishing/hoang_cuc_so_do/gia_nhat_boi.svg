<svg viewBox="0 0 1180 900" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, STKaiti, Songti SC, serif">
<rect width="1180" height="900" fill="#fbf7ef"/>
<text x="590.0" y="40" text-anchor="middle" font-size="27" fill="#2a2018" font-weight="bold">GIA-NHẤT-BỘI (加一倍法) — cây nhân đôi sinh 64 quẻ</text>
<text x="590.0" y="67" text-anchor="middle" font-size="14" fill="#7a5a2a">道→1 Thái Cực→2 Lưỡng Nghi→4 Tứ Tượng→8 Bát Quái→…→64 · Trình Hạo gọi "phép thêm một gấp đôi"</text>
<text x="590.0" y="95" text-anchor="middle" font-size="14" fill="#7a3410" font-weight="bold">① CÂY NHÂN ĐÔI — vạch liền = dương (1), vạch đứt = âm (0)</text>
<circle cx="590.0" cy="129" r="17" fill="#c9a13b" fill-opacity="0.3" stroke="#a8621c"/>
<text x="590.0" y="134" text-anchor="middle" font-size="14" fill="#7a3410" font-weight="bold">太极</text>
<text x="616.0" y="134" font-size="11" fill="#888">1 — Thái Cực</text>
<rect x="308" y="167" width="44" height="7" fill="#7a3410"/>
