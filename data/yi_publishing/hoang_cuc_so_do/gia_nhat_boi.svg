<line x1="590.0" y1="146" x2="850.0" y2="164" stroke="#ccc"/>
<text x="590.0" y="173" text-anchor="middle" font-size="11" fill="#888">2 — Lưỡng Nghi</text>
<rect x="238" y="208" width="44" height="7" fill="#7a3410"/>
<rect x="238" y="197" width="44" height="7" fill="#7a3410"/>
