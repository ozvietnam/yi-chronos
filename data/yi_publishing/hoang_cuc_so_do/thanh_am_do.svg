<text x="320" y="228" text-anchor="middle" font-size="11.5" fill="#777">Mỗi 声 mở ra 4 thanh 平上去入 · DÙNG 7 (đỏ) · BỎ 3 (〇 vô thanh)</text>
<text x="320" y="245" text-anchor="middle" font-size="10.5" fill="#999">清 nhẹ: 多良千刀 · 浊 nặng: 禾光元毛 · 辟 mở: 古黑安夫 · 翕 khép: 黄父兑</text>
<rect x="70" y="280" width="1040" height="36" rx="6" fill="#2f5d8a" fill-opacity="0.08" stroke="#2f5d8a" stroke-opacity="0.4"/>
<text x="590" y="296" text-anchor="middle" font-size="14" fill="#2f5d8a" font-weight="bold">② 地音 — TIẾNG ĐẤT (thanh mẫu / phụ âm)</text>
<text x="590" y="311" text-anchor="middle" font-size="11" fill="#888">12 音 × 开·发·收·闭 (4 phát âm) · thuộc ÂM · theo 唇·舌·牙·齿·喉·半 (chỗ phát)</text>
