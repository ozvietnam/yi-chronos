<text x="590" y="410" text-anchor="middle" font-size="11.5" fill="#777">…12 音, một số ô vô âm (代表无音无字者) · mỗi 音 mở ra 4 phát âm 开发收闭</text>
<text x="590.0" y="448" text-anchor="middle" font-size="15" fill="#7a3410" font-weight="bold">③ XƯỚNG-HỌA: trời ⊗ đất → mọi âm tiết → SỐ</text>
<rect x="280" y="466" width="200" height="50" rx="8" fill="#c0392b" fill-opacity="0.10" stroke="#c0392b"/>
<text x="380" y="488" text-anchor="middle" font-size="13" fill="#a8341c" font-weight="bold">天声 (dương)</text>
<text x="380" y="506" text-anchor="middle" font-size="10.5" fill="#888">10 vận × 4 thanh</text>
<text x="520" y="498" text-anchor="middle" font-size="22" fill="#666">⊗</text>
<rect x="560" y="466" width="200" height="50" rx="8" fill="#2f5d8a" fill-opacity="0.10" stroke="#2f5d8a"/>
<text x="660" y="488" text-anchor="middle" font-size="13" fill="#2f5d8a" font-weight="bold">地音 (âm)</text>
<text x="660" y="506" text-anchor="middle" font-size="10.5" fill="#888">12 thanh-mẫu × 4 phát âm</text>
<text x="800" y="498" text-anchor="middle" font-size="22" fill="#666">→</text>
<rect x="830" y="466" width="240" height="50" rx="8" fill="#3f7d54" fill-opacity="0.10" stroke="#3f7d54"/>
<text x="950" y="488" text-anchor="middle" font-size="12.5" fill="#2f6d44" font-weight="bold">mọi tiếng người = SỐ</text>
<text x="950" y="506" text-anchor="middle" font-size="10" fill="#888">dụng 112 × 152 = 17.024 → … (Ch.6)</text>
<rect x="180" y="540" width="820" height="120" rx="10" fill="#c9a13b" fill-opacity="0.06" stroke="#c9a13b" stroke-opacity="0.4"/>
<text x="590.0" y="566" text-anchor="middle" font-size="14" fill="#8a4a14" font-weight="bold">ĐỒNG DẠNG: tiếng ↔ ánh sáng ↔ số</text>
<text x="590.0" y="588" text-anchor="middle" font-size="11.5" fill="#555">天声 có 10 nhưng DÙNG 7 — vì hạ chí mặt trời HIỆN 7 giờ (寅→戌), còn 亥·子·丑 ba giờ mặt trời LẶN (vô sáng).</text>
<text x="590.0" y="610" text-anchor="middle" font-size="11.5" fill="#555">Ba 声 vô thanh (〇〇〇) = ba giờ vô sáng. Số tiếng KHỚP số giờ — không phải trùng hợp, mà cùng MỘT lưới.</text>
<text x="590.0" y="632" text-anchor="middle" font-size="11.5" fill="#555">Đây là cốt Hoàng Cực: ngôn ngữ, thời gian, ánh sáng — đọc bằng cùng một bộ số. Đọc cấu trúc, không bói.</text>
<text x="590.0" y="824" text-anchor="middle" font-size="11" fill="#999">Nguồn: Quan Vật Ngoại Thiên (bộ trọn tr.677-680) · CHỈ phục hồi leaders + khung; toàn ô (mỗi cell một chữ) nằm trong ảnh gốc = bước sau</text>
</svg>