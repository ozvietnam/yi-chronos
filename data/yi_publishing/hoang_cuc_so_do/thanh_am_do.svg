<text x="590.0" y="67" text-anchor="middle" font-size="14" fill="#7a5a2a">Thiệu Ung xếp MỌI TIẾNG NGƯỜI vào lưới số: vận (trời) ⊗ thanh-mẫu (đất) — "声音之道与政通"</text>
