book_corpus_id: tu-vi-nghiem-ly-toan-thu-thien-luong
title: Tử Vi Nghiệm Lý Toàn Thư
author: Cụ Thiên Lương (Lê Quang Khải, 1910-1985)
school: thien_luong_dao_duc_hoc
total_pages: 186

book_profile:
  core_def: |
    Tử Vi = ĐẠO LÝ + GIÁO DỤC ĐẠO ĐỨC + TÂM LÝ HỌC.
    Tự biết mình, biết người để chung hòa với đời sống.
    KHÔNG huyền bí, KHÔNG tà thuật, KHÔNG dùng kiếm tiền.
    Cốt: 5 bậc tuổi Can-Chi + 3 vòng (Lộc Tồn / Thái Tuế / Tràng Sinh).
  paradigm_keys:
    - "Tử Vi = đạo đức + tâm lý" (Iron Rule #6 mạnh nhất)
    - "5 BẬC TUỔI CAN-CHI"
    - "3 VÒNG LỚN: Lộc Tồn/Thái Tuế/Tràng Sinh"
    - "TAM HỢP TUỔI hưởng Lộc Tồn"
    - "THẾ THÁI CỰC: Mão-Thân Dương, Dậu-Dần Âm"
    - "Can = Phúc đức, Chi = Thân thế"
    - "Tam Hóa Liên Châu"
    - "Hình Riêu Không Kiếp = Oan trái nghiệp quả"

