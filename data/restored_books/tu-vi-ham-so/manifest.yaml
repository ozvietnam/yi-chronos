book_corpus_id: tu-vi-ham-so
title: Tử Vi Hàm Số
author: Nguyễn Phát Lộc
school: nguyen_phat_loc_ham_so
publish_year: 1972
total_pages: 238

book_profile:
  core_def: |
    Tử Vi = KHOA HỌC NHÂN VĂN (sciences humaines).
    "Mang Tử Vi từ thiên đàng xuống nhân thế, từ thần quyền thánh ra nhân bản,
    từ mê tín ra khoa học, từ thiên định đến nhân định."
    Phương pháp HÀM SỐ — tương quan biến thiên giữa các yếu tố.
  paradigm_keys:
    - "Tử Vi = khoa học nhân văn, không huyền bí"
    - "Sao = yếu tố nhân bản (không phải tinh tú thần linh)"
    - "Phương pháp HÀM SỐ — function math"
    - "Khoa học ĐỘNG (dynamique)"
    - "Triết lý Âm Dương Ngũ Hành làm nền"
    - "14 chính tinh + 96 phụ tinh = 110 sao Hàm Số phân tích đầy đủ"

