# Tier metadata cho atomize
book_profile:
  core_def: |
    Mệnh vận học là KHOA HỌC, không huyền bí. Bài toán đặt trên luật tắc cao hơn.
    Mệnh = TÍNH (định trước) + Vận = TAO NGỘ (biến theo thời).
    70% số phận, 30% tự chủ (hữu chí giả). Dịch lý là biến, hung-cát chuyển hoá.
  paradigm_keys:
    - "Không huyền bí" (p5-6, Iron Rule #6 compatible)
    - "Mệnh = TÍNH, Vận = TAO NGỘ" (p5, Giáo sư Tiền Mục)
    - "70/30 — 7 phần số + 3 phần tự chủ" (p7)
    - "Nhân quả vô môn duy nhân sở chiêu" (p6, Tả Truyện)
    - "TỨ YẾU" (Cát Hung / Hư Thực / Chủ Khách / Cường Nhược) (p18)
    - "THẬP DỤ" (10 cách xem 4 cung) (p19)
    - "BÁT PHÁP" (Thành/Phá + Cứu/Khí) (p19-20)
    - "Mệnh = THỂ, Thân = DỤNG" (p65)
    - "NHÂN CUNG" (8 trường hợp giảm 80% giá trị) (p63-64)
    - "Cường/Nhược cung khác Nam-Nữ" (p65)
  conflict_with_tcq2: |
    - HIGH similarity (cùng Trần Đoàn gốc)
    - Toàn Thư có Bát Pháp + Thập Dụ + Nhân Cung mà TCQ2 không có
    - Toàn Thư có Phong Thần 14 sao truyền thuyết
    - Hóa Kỵ trong Toàn Thư = "đụng đâu hại đó", VN nói "ở Tài+Điền lại đắc"
    - Thiên Hình "không hẳn hung — nhập miếu là Hỉ Thần"
    - Khôi Việt "không có hãm địa"

